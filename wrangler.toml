name = "lingofusion-gateway"
main = "cloudflare-worker/worker.mjs"
compatibility_date = "2025-01-01"

[vars]
APP_URL = "https://ikonikstation.github.io/lingofusion-developers/playground"

[[kv_namespaces]]
binding = "GIFTS"
id = "4f4c6238db9540f08168d10181296a37"

[[durable_objects.bindings]]
name = "GIFT_CLAIMS"
class_name = "GiftClaims"

[[migrations]]
tag = "gift-claims-v1"
new_sqlite_classes = ["GiftClaims"]
