name: Deploy LingoFusion Developers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check billing security
        run: |
          node --test scripts/test-billing.mjs
          node scripts/test-gifts.mjs
          node scripts/test-billing-node.mjs
          npm run test:text-billing
          npm run test:transcription
          npm run test:unlimited-balance
          npm run test:web-translation
          node --test scripts/test-edge-input-bounds.mjs scripts/test-gateway-async-errors.mjs

      - name: Check localization
        run: pnpm test:localization

      - name: Build site
        env:
          VITE_LINGOFUSION_GATEWAY_URL: ${{ vars.VITE_LINGOFUSION_GATEWAY_URL }}
        run: |
          pnpm build
          mkdir -p dist/models
          cp dist/index.html dist/models/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
